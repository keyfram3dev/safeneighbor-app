  <!-- Secondary features -->
  <text
    x="600"
    y="448"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-weight="500"
    font-size="21"
    fill="#94a3b8"
