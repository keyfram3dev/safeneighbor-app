    <g transform="translate(7, 5) scale(5.75)">
      <path
        d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
        fill="url(#shieldGrad)"
        stroke="#94a3b8"
        stroke-width="0.3"
        stroke-linejoin="round"
      />
    </g>

    <!-- Group people icon inside shield -->
    <g transform="translate(42, 38) scale(0.057)" fill="#ffffff">
      <path d="m344.4 477.6c19.199 0 38.398-3.6016 55.199-10.801-1.1992-8.3984-1.1992-16.801-1.1992-25.199 0-64.801 31.199-123.6 79.199-160.8-21.602-52.801-73.199-90-133.2-90-79.199 0-142.8 63.602-142.8 142.8 0.003906 79.199 63.602 144 142.8 144z"/>
