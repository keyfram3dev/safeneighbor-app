  <!-- Bottom bar -->
  <rect x="0" y="545" width="1200" height="85" fill="#0f172a" opacity="0.5"/>

  <!-- Free badge + URL -->
  <text
    x="600"
    y="596"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-weight="600"
    font-size="20"
    fill="#64748b"
