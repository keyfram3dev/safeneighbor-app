  <!-- SafeNeighbor title -->
  <text
    x="600"
    y="268"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-weight="900"
    font-size="64"
    letter-spacing="-1"
    fill="#f1f5f9"
  >SafeNeighbor</text>

  <!-- Community Safety subtitle -->
  <text
    x="600"
    y="318"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="22"
    letter-spacing="6"
    fill="#94a3b8"
  >COMMUNITY SAFETY</text>

  <!-- Divider line -->
  <rect x="450" y="345" width="300" height="1" rx="0.5" fill="#475569" opacity="0.5"/>

  <!-- CTA -->
  <text
    x="600"
    y="400"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="32"
    fill="#f1f5f9"
