      <path d="m801.6 441.6c0 8.3984 0 16.801-1.1992 25.199 16.801 7.1992 36 10.801 55.199 10.801 79.199 0 142.8-63.602 142.8-142.8s-63.602-142.8-142.8-142.8c-60 0-111.6 37.199-133.2 90 47.996 36 79.199 93.602 79.199 159.6z"/>
      <path d="m1138.8 716.4c-16.801-102-86.398-216-180-253.2-26.398 26.398-70.801 36-104.4 36-18 0-39.602-2.3984-58.801-9.6016-9.6016 37.199-28.801 69.602-55.199 96 88.801 36 159.6 121.2 201.6 212.4 69.602-4.8008 120-13.199 158.4-27.602 25.199-7.1953 43.199-27.594 38.398-53.996z"/>
      <path d="m781.2 442.8c0 100.07-81.125 181.2-181.2 181.2s-181.2-81.125-181.2-181.2 81.125-181.2 181.2-181.2 181.2 81.125 181.2 181.2z"/>
      <path d="m730.8 606c-33.602 33.602-90 45.602-130.8 45.602-42 0-98.398-12-132-46.801-116.4 44.398-204 186-226.8 310.8-7.1992 37.199 19.199 68.398 56.398 80.398 73.199 22.801 189.6 36 302.4 36 148.8 0 243.6-14.398 309.6-37.199 31.199-10.801 54-37.199 49.199-69.602-21.598-128.4-109.2-273.6-228-319.2z"/>
    </g>

    <!-- Glassmorphism on icon -->
