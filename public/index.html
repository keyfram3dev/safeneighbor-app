    <script>
      // Pre-fetch IP location before React mounts
      // Uses same-origin endpoint first (works through any service worker version)
      (function() {
        var urls = ['/api/ip-location', 'https://ipwho.is/', 'https://ipapi.co/json/'];
        function tryNext(i) {
          if (i >= urls.length) return;
          fetch(urls[i], { cache: 'no-store' })
            .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
            .then(function(d) {
              var lat = d.lat || d.latitude, lng = d.lng || d.longitude;
              if (lat && lng) {
                window.__ipLocation = { lat: lat, lng: lng };
              } else {
                tryNext(i + 1);
              }
            })
            .catch(function() { tryNext(i + 1); });
        }
        tryNext(0);
      })();
    </script>
